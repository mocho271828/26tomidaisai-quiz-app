name: AWS Review Reset Event

on:
  workflow_dispatch:
    inputs:
      expected_event_id:
        description: AWS Review Event StatusのSummaryにあるexpected_event_id
        type: string
        required: true
      expected_event_version:
        description: AWS Review Event StatusのSummaryにあるexpected_event_version（進行操作後は再取得）
        type: string
        required: true
      confirmation:
        description: 参加者・回答・得点・進行の初期化を確認し RESET EVENT と入力
        type: string
        required: true

permissions:
  contents: read

env:
  AWS_REVIEW_REPOSITORY: ${{ vars.AWS_REVIEW_REPOSITORY }}
  AWS_REVIEW_OPERATOR: ${{ vars.AWS_REVIEW_OPERATOR }}

jobs:
  authorize:
    name: 初期化の実行者・ブランチを確認
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 所有者によるmainからの実行だけ許可
        shell: bash
        run: |
          if [[ -z "$AWS_REVIEW_REPOSITORY" || -z "$AWS_REVIEW_OPERATOR" ||
                "$GITHUB_REPOSITORY" != "$AWS_REVIEW_REPOSITORY" ||
                "$GITHUB_REF" != "refs/heads/main" ||
                "$GITHUB_ACTOR" != "$AWS_REVIEW_OPERATOR" ||
                "$GITHUB_TRIGGERING_ACTOR" != "$AWS_REVIEW_OPERATOR" ]]; then
            echo "::error::AWS操作は設定したリポジトリの main から、指定した運営担当者が実行・再実行した場合だけ許可されます。"
            exit 1
          fi

  reset-event:
    name: AWS構成を維持して開催データを初期化
    needs: authorize
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: aws-review
    concurrency:
      group: aws-review
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-1
      AWS_DEFAULT_REGION: ap-northeast-1
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_REVIEW_ID: ${{ secrets.AWS_REVIEW_ID }}
      AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
      AWS_REVIEW_EXPECTED_EVENT_ID: ${{ inputs.expected_event_id }}
      AWS_REVIEW_EXPECTED_EVENT_VERSION: ${{ inputs.expected_event_version }}
      AWS_REVIEW_RESET_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: 必須Environment secretsを確認
        shell: bash
        run: |
          for variable in AWS_ACCOUNT_ID AWS_REVIEW_ID AWS_DEPLOY_ROLE_ARN; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Environment aws-review の Secrets に ${variable} を設定してください。"
              exit 1
            fi
          done
          export LC_ALL=C
          if [[ ! "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]; then
            echo "::error::Environment aws-review の Secret AWS_ACCOUNT_ID は半角数字12桁で設定してください。"
            exit 1
          fi
          # macOSでの回帰検証にも使えるよう、pathの上限510文字を255文字ずつに分ける。
          role_arn_pattern="^arn:aws:iam::${AWS_ACCOUNT_ID}:role/([!-~]{0,255}[!-~]{1,255}/)?[A-Za-z0-9_+=,.@-]{1,64}$"
          if [[ ! "$AWS_DEPLOY_ROLE_ARN" =~ $role_arn_pattern ]]; then
            echo "::error::Secret AWS_DEPLOY_ROLE_ARN の形式またはaccountが不正です。CloudFormationのDeployRoleArnを、引用符・空白・改行なしで登録し、AWS_ACCOUNT_IDとの一致を確認してください。"
            exit 1
          fi
          if [[ "$AWS_REVIEW_RESET_CONFIRMATION" != 'RESET EVENT' ]]; then
            echo "::error::初期化する範囲を確認して、確認欄へ RESET EVENT と入力してください。"
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.28"
          python-version: "3.12"
          enable-cache: false
      - name: 固定済み依存をインストール
        run: uv sync --frozen --no-dev --project backend
      - name: OIDCで既存の配置roleを引き受ける
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1
          role-duration-seconds: 3600
          role-session-name: review-reset-${{ github.run_id }}-${{ github.run_attempt }}
          unset-current-credentials: true
      - name: 稼働版を照合して開催データを初期化
        run: uv run --no-sync --project backend python -m validation.aws_review reset-event
