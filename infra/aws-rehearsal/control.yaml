AWSTemplateFormatVersion: '2010-09-09'
Description: Rehearsal artifacts, deployment role, and ordered deadline cleanup.

Parameters:
  EnableDeadline:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Disable only for the manually operated GitHub review environment.
  DemoId:
    Type: String
    MinLength: 1
    MaxLength: 32
    AllowedPattern: '[a-z0-9][a-z0-9-]*'
  DeadlineLocal:
    Type: String
    Default: '2026-09-20T23:00:00'
    AllowedPattern: '[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}'
  AppInstanceId:
    Type: String
    Default: ''
    AllowedPattern: '(^$|i-[0-9a-f]{17})'
  EdgeStackArn:
    Type: String
    Default: ''
    AllowedPattern: '(^$|arn:aws:cloudformation:ap-northeast-1:[0-9]{12}:stack/gs-rehearsal-[a-z0-9-]+-edge/[a-z0-9-]+)'
  WorkloadStackArn:
    Type: String
    Default: ''
    AllowedPattern: '(^$|arn:aws:cloudformation:ap-northeast-1:[0-9]{12}:stack/gs-rehearsal-[a-z0-9-]+-workload/[a-z0-9-]+)'

Conditions:
  HasDeadline: !Equals [!Ref EnableDeadline, 'true']

Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !If [HasDeadline, !Ref 'AWS::NoValue', !Sub 'gs-review-${DemoId}-${AWS::AccountId}']
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      # 撤去時に全objectを消してからcontrol stackを削除するためversioningは使用しない。
      Tags:
        - {Key: DemoId, Value: !Ref DemoId}
        - {Key: Purpose, Value: quiz-rehearsal}

  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: RequireTls
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt ArtifactBucket.Arn, !Sub '${ArtifactBucket.Arn}/*']
            Condition:
              Bool: {aws:SecureTransport: false}

  CloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !If [HasDeadline, !Ref 'AWS::NoValue', !Sub 'gs-review-${DemoId}-cfn']
      Description: Pass this role explicitly when creating or deleting the dedicated workload and edge stacks.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: cloudformation.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DedicatedRehearsalDeployment
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # network IDは作成前に分からず、関連付けAPIも含むため操作名とregionを限定する。
              - Sid: ComputeAndNetwork
                Effect: Allow
                Action:
                  - ec2:Describe*
                  - ec2:CreateVpc
                  - ec2:DeleteVpc
                  - ec2:ModifyVpcAttribute
                  - ec2:CreateSubnet
                  - ec2:DeleteSubnet
                  - ec2:ModifySubnetAttribute
                  - ec2:CreateInternetGateway
                  - ec2:DeleteInternetGateway
                  - ec2:AttachInternetGateway
                  - ec2:DetachInternetGateway
                  - ec2:CreateRouteTable
                  - ec2:DeleteRouteTable
                  - ec2:AssociateRouteTable
                  - ec2:DisassociateRouteTable
                  - ec2:ReplaceRouteTableAssociation
                  - ec2:CreateRoute
                  - ec2:ReplaceRoute
                  - ec2:DeleteRoute
                  - ec2:AllocateAddress
                  - ec2:ReleaseAddress
                  - ec2:CreateNatGateway
                  - ec2:DeleteNatGateway
                  - ec2:CreateSecurityGroup
                  - ec2:DeleteSecurityGroup
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:RevokeSecurityGroupIngress
                  - ec2:AuthorizeSecurityGroupEgress
                  - ec2:RevokeSecurityGroupEgress
                  - ec2:UpdateSecurityGroupRuleDescriptionsIngress
                  - ec2:UpdateSecurityGroupRuleDescriptionsEgress
                  - ec2:RunInstances
                  - ec2:TerminateInstances
                  - ec2:StopInstances
                  - ec2:ModifyInstanceAttribute
                  - ec2:ModifyInstanceMetadataOptions
                  - ec2:MonitorInstances
                  - ec2:UnmonitorInstances
                  - ec2:ModifyInstanceCreditSpecification
                  - ec2:CreateTags
                  - ec2:DeleteTags
                Resource: '*'
                Condition:
                  StringEquals: {aws:RequestedRegion: !Ref 'AWS::Region'}
              - Sid: DedicatedMonitoringDashboard
                Effect: Allow
                Action: [cloudwatch:GetDashboard, cloudwatch:PutDashboard, cloudwatch:DeleteDashboards]
                Resource: !Sub 'arn:${AWS::Partition}:cloudwatch::${AWS::AccountId}:dashboard/gs-rehearsal-${DemoId}-health'
              - Sid: DedicatedDatabase
                Effect: Allow
                Action:
                  - rds:CreateDBInstance
                  - rds:ModifyDBInstance
                  - rds:DeleteDBInstance
                  - rds:CreateDBSubnetGroup
                  - rds:ModifyDBSubnetGroup
                  - rds:DeleteDBSubnetGroup
                  - rds:AddTagsToResource
                  - rds:RemoveTagsFromResource
                  - rds:ListTagsForResource
                Resource:
                  - !Sub 'arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:db:gs-rehearsal-${DemoId}-*'
                  - !Sub 'arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:subgrp:gs-rehearsal-${DemoId}-*'
                  - !Sub 'arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:pg:default.postgres16'
                  - !Sub 'arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:og:default:postgres-16'
              - Sid: DatabaseRead
                Effect: Allow
                Action: rds:Describe*
                Resource: '*'
              - Sid: DedicatedCache
                Effect: Allow
                Action:
                  - elasticache:CreateReplicationGroup
                  - elasticache:ModifyReplicationGroup
                  - elasticache:DeleteReplicationGroup
                  - elasticache:CreateCacheSubnetGroup
                  - elasticache:ModifyCacheSubnetGroup
                  - elasticache:DeleteCacheSubnetGroup
                  - elasticache:AddTagsToResource
                  - elasticache:RemoveTagsFromResource
                  - elasticache:ListTagsForResource
                Resource:
                  - !Sub 'arn:${AWS::Partition}:elasticache:${AWS::Region}:${AWS::AccountId}:replicationgroup:gs-rehearsal-${DemoId}-*'
                  - !Sub 'arn:${AWS::Partition}:elasticache:${AWS::Region}:${AWS::AccountId}:cluster:gs-rehearsal-${DemoId}-*'
                  - !Sub 'arn:${AWS::Partition}:elasticache:${AWS::Region}:${AWS::AccountId}:subnetgroup:gs-rehearsal-${DemoId}-*'
                  - !Sub 'arn:${AWS::Partition}:elasticache:${AWS::Region}:${AWS::AccountId}:parametergroup:default.redis7'
              - Sid: CacheRead
                Effect: Allow
                Action: elasticache:Describe*
                Resource: '*'
              - Sid: DedicatedRepositories
                Effect: Allow
                Action:
                  - ecr:CreateRepository
                  - ecr:DeleteRepository
                  - ecr:DescribeRepositories
                  - ecr:TagResource
                  - ecr:UntagResource
                  - ecr:ListTagsForResource
                  - ecr:PutImageTagMutability
                Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/gs-rehearsal-${DemoId}/*'
              - Sid: DedicatedSecrets
                Effect: Allow
                Action:
                  - secretsmanager:CreateSecret
                  - secretsmanager:DescribeSecret
                  - secretsmanager:GetSecretValue
                  - secretsmanager:PutSecretValue
                  - secretsmanager:UpdateSecret
                  - secretsmanager:DeleteSecret
                  - secretsmanager:TagResource
                  - secretsmanager:UntagResource
                Resource: !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:gs-rehearsal-${DemoId}-*'
              - Sid: RdsManagedSecretCreation
                Effect: Allow
                Action: [secretsmanager:CreateSecret, secretsmanager:TagResource]
                Resource: !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rds!db-*'
              - Sid: GenerateSecret
                Effect: Allow
                Action: secretsmanager:GetRandomPassword
                Resource: '*'
              - Sid: DescribeEncryptionKeys
                Effect: Allow
                Action: kms:DescribeKey
                Resource: !Sub 'arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*'
              - Sid: DedicatedLogs
                Effect: Allow
                Action: [logs:CreateLogGroup, logs:DeleteLogGroup, logs:PutRetentionPolicy, logs:DeleteRetentionPolicy, logs:TagResource, logs:UntagResource, logs:ListTagsForResource]
                Resource:
                  - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/gs-app-tomidaisai/rehearsal/${DemoId}:*'
                  - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/gs-app-tomidaisai/rehearsal/${DemoId}'
              - Sid: ReadLogGroups
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: '*'
              - Sid: DedicatedApplicationRole
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListRoleTags
                  - iam:ListInstanceProfilesForRole
                  - iam:ListAttachedRolePolicies
                  - iam:TagRole
                  - iam:UntagRole
                Resource: !If [HasDeadline, !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/gs-rehearsal-${DemoId}-workload-*', !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/gs-review-${DemoId}-app']
              - Sid: ApplicationSsmPolicyOnly
                Effect: Allow
                Action: [iam:AttachRolePolicy, iam:DetachRolePolicy]
                Resource: !If [HasDeadline, !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/gs-rehearsal-${DemoId}-workload-*', !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/gs-review-${DemoId}-app']
                Condition:
                  ArnEquals:
                    iam:PolicyARN: !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore'
              - Sid: DedicatedInstanceProfile
                Effect: Allow
                Action: [iam:CreateInstanceProfile, iam:DeleteInstanceProfile, iam:GetInstanceProfile, iam:AddRoleToInstanceProfile, iam:RemoveRoleFromInstanceProfile, iam:TagInstanceProfile, iam:UntagInstanceProfile, iam:ListInstanceProfileTags]
                Resource: !If [HasDeadline, !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:instance-profile/gs-rehearsal-${DemoId}-workload-*', !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:instance-profile/gs-review-${DemoId}-app']
              - Sid: PassApplicationRoleOnly
                Effect: Allow
                Action: iam:PassRole
                Resource: !If [HasDeadline, !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/gs-rehearsal-${DemoId}-workload-*', !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/gs-review-${DemoId}-app']
                Condition:
                  StringEquals: {iam:PassedToService: ec2.amazonaws.com}
              - Sid: RequiredServiceLinkedRoles
                Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/*'
                Condition:
                  StringEquals:
                    iam:AWSServiceName: [rds.amazonaws.com, elasticache.amazonaws.com, vpcorigin.cloudfront.amazonaws.com]
              - Sid: ReadServiceLinkedRoles
                Effect: Allow
                Action: iam:GetRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/*'
              # 作成APIはresource ARN指定非対応のため、必須request tagでこのdemoに限定する。
              - Sid: CreatePublicEdge
                Effect: Allow
                Action: [cloudfront:CreateDistribution, cloudfront:CreateVpcOrigin]
                Resource: '*'
                Condition:
                  StringEquals: {aws:RequestTag/DemoId: !Ref DemoId}
              # CloudFront resource IDは生成値なので、操作名とaccountを限定する。
              - Sid: PublicEdge
                Effect: Allow
                Action:
                  - cloudfront:GetDistribution
                  - cloudfront:GetDistributionConfig
                  - cloudfront:UpdateDistribution
                  - cloudfront:DeleteDistribution
                  - cloudfront:GetVpcOrigin
                  - cloudfront:UpdateVpcOrigin
                  - cloudfront:DeleteVpcOrigin
                  - cloudfront:TagResource
                  - cloudfront:UntagResource
                  - cloudfront:ListTagsForResource
                Resource:
                  - !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/*'
                  - !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:vpcorigin/*'
      Tags:
        - {Key: DemoId, Value: !Ref DemoId}
        - {Key: Purpose, Value: quiz-rehearsal}

  CleanupRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !If [HasDeadline, !Ref 'AWS::NoValue', !Sub 'gs-review-${DemoId}-cleanup']
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: states.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals: {aws:SourceAccount: !Ref 'AWS::AccountId'}
              ArnEquals:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:gs-rehearsal-${DemoId}-cleanup'
      Policies:
        - PolicyName: OrderedDedicatedCleanup
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ec2:StopInstances
                Resource: !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*'
                Condition:
                  StringEquals: {ec2:ResourceTag/DemoId: !Ref DemoId}
              - Effect: Allow
                Action: [cloudformation:DeleteStack, cloudformation:DescribeStacks]
                Resource:
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/gs-rehearsal-${DemoId}-edge/*'
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/gs-rehearsal-${DemoId}-workload/*'
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationExecutionRole.Arn
                Condition:
                  StringEquals: {iam:PassedToService: cloudformation.amazonaws.com}
      Tags:
        - {Key: DemoId, Value: !Ref DemoId}
        - {Key: Purpose, Value: quiz-rehearsal}

  CleanupStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub 'gs-rehearsal-${DemoId}-cleanup'
      StateMachineType: STANDARD
      RoleArn: !GetAtt CleanupRole.Arn
      Definition:
        Comment: Stop the app, then delete edge and workload; leave this control stack for final inspection.
        StartAt: ValidateInput
        TimeoutSeconds: 3600
        States:
          ValidateInput:
            Type: Choice
            Choices:
              - And:
                  - {Variable: $.AppInstanceId, IsPresent: true}
                  - {Variable: $.AppInstanceId, IsString: true}
                  - {Variable: $.EdgeStackArn, IsPresent: true}
                  - {Variable: $.EdgeStackArn, IsString: true}
                  - {Variable: $.WorkloadStackArn, IsPresent: true}
                  - {Variable: $.WorkloadStackArn, IsString: true}
                Next: HasInstance
            Default: InvalidInput
          HasInstance:
            Type: Choice
            Choices:
              - Variable: $.AppInstanceId
                StringEquals: ''
                Next: StackOrder
            Default: StopInstance
          StopInstance:
            Type: Task
            Resource: !Sub 'arn:${AWS::Partition}:states:::aws-sdk:ec2:stopInstances'
            Parameters:
              InstanceIds.$: States.Array($.AppInstanceId)
            ResultPath: $.StopResult
            TimeoutSeconds: 60
            Retry:
              - ErrorEquals: [States.TaskFailed, States.Timeout]
                IntervalSeconds: 10
                BackoffRate: 2
                MaxAttempts: 3
            # 既にinstanceが終了済みでも、edgeとworkloadの回収を継続する。
            Catch:
              - ErrorEquals: [States.TaskFailed, States.Timeout]
                ResultPath: $.StopFailure
                Next: StackOrder
            Next: StackOrder
          StackOrder:
            Type: Pass
            Parameters:
              StackArns.$: States.Array($.EdgeStackArn, $.WorkloadStackArn)
            ResultPath: $.DeletionOrder
            Next: DeleteInOrder
          DeleteInOrder:
            Type: Map
            ItemsPath: $.DeletionOrder.StackArns
            MaxConcurrency: 1
            ResultPath: $.DeletionResults
            ItemSelector:
              StackArn.$: $$.Map.Item.Value
            # 配列の順番と同時実行数1により、edge削除完了前のworkload削除を防ぐ。
            ItemProcessor:
              ProcessorConfig: {Mode: INLINE}
              StartAt: HasStack
              States:
                HasStack:
                  Type: Choice
                  Choices:
                    - Variable: $.StackArn
                      StringEquals: ''
                      Next: StackDone
                  Default: DeleteStack
                DeleteStack:
                  Type: Task
                  Resource: !Sub 'arn:${AWS::Partition}:states:::aws-sdk:cloudformation:deleteStack'
                  Parameters:
                    StackName.$: $.StackArn
                    RoleARN: !GetAtt CloudFormationExecutionRole.Arn
                  ResultPath: $.DeletionRequest
                  TimeoutSeconds: 60
                  Retry:
                    - ErrorEquals: [States.TaskFailed]
                      IntervalSeconds: 10
                      BackoffRate: 2
                      MaxAttempts: 3
                  Next: WaitForDeletion
                WaitForDeletion:
                  Type: Wait
                  Seconds: 30
                  Next: DescribeStack
                DescribeStack:
                  Type: Task
                  Resource: !Sub 'arn:${AWS::Partition}:states:::aws-sdk:cloudformation:describeStacks'
                  Parameters:
                    StackName.$: $.StackArn
                  # Describe結果からstatusだけを抽出し、stackのparameters/outputsを下流へ渡さない。
                  ResultSelector:
                    Status.$: $.Stacks[0].StackStatus
                  ResultPath: $.Deletion
                  TimeoutSeconds: 60
                  Retry:
                    - ErrorEquals: [States.TaskFailed]
                      IntervalSeconds: 10
                      BackoffRate: 2
                      MaxAttempts: 3
                  Next: CheckDeletion
                CheckDeletion:
                  Type: Choice
                  Choices:
                    - Variable: $.Deletion.Status
                      StringEquals: DELETE_COMPLETE
                      Next: StackDone
                    - Variable: $.Deletion.Status
                      StringEquals: DELETE_IN_PROGRESS
                      Next: WaitForDeletion
                  Default: DeletionFailed
                DeletionFailed:
                  Type: Fail
                  Error: StackDeletionFailed
                  Cause: The dedicated stack did not reach DELETE_COMPLETE; inspect its CloudFormation events.
                StackDone:
                  Type: Succeed
            End: true
          InvalidInput:
            Type: Fail
            Error: CleanupInputInvalid
            Cause: AppInstanceId, EdgeStackArn and WorkloadStackArn must be strings.
      Tags:
        - {Key: DemoId, Value: !Ref DemoId}
        - {Key: Purpose, Value: quiz-rehearsal}

  SchedulerRole:
    Type: AWS::IAM::Role
    Condition: HasDeadline
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: scheduler.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals: {aws:SourceAccount: !Ref 'AWS::AccountId'}
              ArnEquals:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule-group/default'
      Policies:
        - PolicyName: StartDedicatedCleanup
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: states:StartExecution
                Resource: !Ref CleanupStateMachine
      Tags:
        - {Key: DemoId, Value: !Ref DemoId}
        - {Key: Purpose, Value: quiz-rehearsal}

  DeadlineSchedule:
    Type: AWS::Scheduler::Schedule
    Condition: HasDeadline
    Properties:
      Name: !Sub 'gs-rehearsal-${DemoId}-deadline'
      Description: Set ActionAfterCompletion DELETE using Scheduler update-schedule after creation.
      ScheduleExpression: !Sub 'at(${DeadlineLocal})'
      ScheduleExpressionTimezone: Asia/Tokyo
      FlexibleTimeWindow: {Mode: 'OFF'}
      State: ENABLED
      Target:
        Arn: !Ref CleanupStateMachine
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: !Sub '{"AppInstanceId":"${AppInstanceId}","EdgeStackArn":"${EdgeStackArn}","WorkloadStackArn":"${WorkloadStackArn}"}'
        # StartExecutionの受付再試行であり、失敗したcleanup全体は自動で最初から再実行しない。
        RetryPolicy:
          MaximumEventAgeInSeconds: 300
          MaximumRetryAttempts: 2

Outputs:
  ArtifactBucketName:
    Description: Private upload bucket; empty all objects before deleting the control stack.
    Value: !Ref ArtifactBucket
  CloudFormationExecutionRoleArn:
    Description: Required RoleARN for creating and deleting both the dedicated workload and edge stacks.
    Value: !GetAtt CloudFormationExecutionRole.Arn
  CleanupStateMachineArn:
    Description: Standard workflow for ordered deadline cleanup.
    Value: !Ref CleanupStateMachine
  DeadlineScheduleName:
    Condition: HasDeadline
    Description: Update target input and ActionAfterCompletion DELETE through the Scheduler CLI, then read back.
    Value: !Ref DeadlineSchedule
  DeadlineScheduleArn:
    Condition: HasDeadline
    Description: One-time schedule at DeadlineLocal in Asia/Tokyo.
    Value: !GetAtt DeadlineSchedule.Arn
  SchedulerRoleArn:
    Condition: HasDeadline
    Description: Preserve this role ARN when updating the schedule target.
    Value: !GetAtt SchedulerRole.Arn
