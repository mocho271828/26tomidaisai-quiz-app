[project]
name = "tomidaisai-quiz-api"
version = "0.1.0"
description = "富大祭クイズAPI"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.16,<2",
  "argon2-cffi>=25,<26",
  "boto3>=1.40,<2",
  "cryptography>=45,<47",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "logfire[fastapi]>=4,<5",
  "prometheus-client>=0.26,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "redis>=6,<7",
  "sqlalchemy[asyncio]>=2.0.14,<2.1",
  "sqlmodel>=0.0.24,<0.1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
aws-login = ["boto3[crt]>=1.40,<2"]

[dependency-groups]
aws-cleanup = [
  "boto3>=1.40,<2",
  "logfire>=4,<5",
  "pydantic>=2,<3",
]
dev = [
  "pytest>=8.4,<10",
  "pytest-asyncio>=1,<2",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quiz_app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["../tests"]
pythonpath = [".."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"../tests/**/*.py" = ["ANN201"]

[tool.ruff.lint.isort]
known-first-party = ["quiz_app", "validation"]
