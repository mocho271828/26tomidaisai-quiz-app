<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="富大祭2026 ゲストクイズのサイトは只今準備中です。" />
    <meta name="theme-color" content="#18679d" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="assets/tokens.css" />
    <title>只今準備中です｜富大祭2026 ゲストクイズ</title>
    <style>
      @font-face {
        font-family: "Noto Sans JP";
        src: url("assets/NotoSansJP-Variable.woff2") format("woff2");
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
      }
      :root {
        color-scheme: light;
        color: var(--color-text-primary);
        background: var(--color-bg-page);
        font-family: var(--font-family-body);
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }
      * { box-sizing: border-box; }
      body { margin: 0; }
      .page {
        display: flex;
        flex-direction: column;
        width: min(100%, var(--content-max));
        min-height: 100vh;
        min-height: 100svh;
        margin-inline: auto;
      }
      /* 参加画面のParticipantHeaderと同じロゴ・高さ・余白を使う。 */
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-3);
        min-height: calc(var(--header-height) + var(--safe-area-top));
        padding: var(--safe-area-top) max(var(--space-4), var(--safe-area-right)) 0 max(var(--space-4), var(--safe-area-left));
        background: var(--color-bg-header);
      }
      .festival-logo { min-width: 0; width: auto; height: auto; max-width: 55%; max-height: var(--header-logo-height); object-fit: contain; }
      .event-badge {
        flex-shrink: 0;
        padding: var(--space-1) var(--space-3);
        border-radius: var(--radius-pill);
        color: var(--color-text-link);
        background: var(--color-bg-surface);
        font-size: var(--font-sm);
        font-weight: var(--weight-bold);
        line-height: var(--leading-compact);
      }
      main {
        display: flex;
        flex: 1;
        flex-direction: column;
        padding: var(--space-6) max(var(--space-4), var(--safe-area-right)) max(var(--space-6), var(--safe-area-bottom)) max(var(--space-4), var(--safe-area-left));
      }
      h1 {
        margin: 0;
        font-family: var(--font-family-display);
        font-size: var(--font-3xl);
        font-weight: var(--weight-heavy);
        line-height: var(--leading-heading);
        font-feature-settings: "palt";
      }
      h1 span { display: block; }
      .mascot {
        display: flex;
        flex: 1;
        align-items: center;
        justify-content: center;
        padding-block: var(--space-5) var(--space-6);
      }
      .mascot img { display: block; width: min(280px, 100%, 34svh); height: auto; }
      .description {
        margin: 0;
        border-top: 2px solid var(--color-border-strong);
        padding-top: var(--space-4);
        text-align: center;
        font-size: var(--font-body);
        line-height: var(--leading-body);
        overflow-wrap: anywhere;
      }
      @media (max-height: 480px) and (min-width: 480px) {
        header { min-height: 48px; }
        .festival-logo { max-height: 32px; }
        main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(100px, 160px); align-items: center; gap: var(--space-4); }
        .mascot { grid-column: 2; grid-row: 1 / 3; padding: 0; }
        .description { text-align: left; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header>
        <img class="festival-logo" src="assets/tomidaisai-2026-logo.png" width="756" height="228" alt="富大祭2026" />
        <span class="event-badge">ゲスト企画</span>
      </header>
      <main>
        <h1><span>サイトは只今</span><span>準備中です。</span></h1>
        <div class="mascot"><img src="assets/tommy-greeting.webp" width="1280" height="1280" alt="" /></div>
        <p class="description">公開まで、もうしばらくお待ちください。</p>
      </main>
    </div>
  </body>
</html>
